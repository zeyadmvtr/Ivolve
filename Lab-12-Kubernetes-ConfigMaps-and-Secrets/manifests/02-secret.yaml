apiVersion: v1
kind: Secret
metadata:
  name: ivolveSecret
  namespace: ivolve
  labels:
    app.kubernetes.io/part-of: ivolve-platform
    app.kubernetes.io/component: database-credentials
type: Opaque
data:
  # Base64 encoded values:
  # MYSQL_ROOT_PASSWORD = base64("ivolveRootPass2026!") -> aXZvbHZlUm9vdFBhc3MyMDI2IQ==
  # DB_PASSWORD         = base64("ivolveUserPass2026!") -> aXZvbHZlVXNlclBhc3MyMDI2IQ==
  MYSQL_ROOT_PASSWORD: aXZvbHZlUm9vdFBhc3MyMDI2IQ==
  DB_PASSWORD: aXZvbHZlVXNlclBhc3MyMDI2IQ==
