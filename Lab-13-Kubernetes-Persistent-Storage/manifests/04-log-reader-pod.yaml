apiVersion: v1
kind: Pod
metadata:
  name: ivolve-log-reader
  namespace: ivolve
  labels:
    app: ivolve-log-reader
spec:
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "cat /mnt/app-logs/application.log; sleep 3600"]
      volumeMounts:
        - name: shared-logs
          mountPath: /mnt/app-logs
          readOnly: true
  volumes:
    - name: shared-logs
      persistentVolumeClaim:
        claimName: ivolvePVC
