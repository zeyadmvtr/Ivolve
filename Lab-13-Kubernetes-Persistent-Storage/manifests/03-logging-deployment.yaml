apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivolve-logging-app
  namespace: ivolve
  labels:
    app: ivolve-logging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ivolve-logging
  template:
    metadata:
      labels:
        app: ivolve-logging
    spec:
      containers:
        - name: log-producer
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [INFO] [${HOSTNAME}] Logging worker started." >> /mnt/app-logs/application.log
              while true; do
                echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [INFO] [${HOSTNAME}] Heartbeat event written to shared storage." >> /mnt/app-logs/application.log
                sleep 5
              done
          volumeMounts:
            - name: shared-logs
              mountPath: /mnt/app-logs
      volumes:
        - name: shared-logs
          persistentVolumeClaim:
            claimName: ivolvePVC
