apiVersion: v1
kind: PersistentVolume
metadata:
  name: ivolvePV
  labels:
    type: local-logging
    app.kubernetes.io/name: ivolve-storage
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/app-logs
    type: DirectoryOrCreate
