apiVersion: v1
kind: Pod
metadata:
  name: unauthorized-rogue-client
  namespace: ivolve
  labels:
    # Not labeled with 'app: ivolve-app' -> traffic MUST be blocked by ivolveNP
    app: unauthorized-client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Testing TCP connectivity from UNAUTHORIZED pod (app: unauthorized-client) to ivolveDBSvc:3306..."
          nc -z -v -w 5 ivolveDBSvc 3306
          if [ $? -ne 0 ]; then
            echo "[BLOCKED] Connection to MySQL port 3306 was successfully dropped by NetworkPolicy!"
          else
            echo "[-] WARNING: Traffic was allowed. Check NetworkPolicy and CNI status."
          fi
          sleep 3600
