apiVersion: apps/v1
kind: Deployment
metadata:
  name: ivolveApp
  namespace: ivolve
  labels:
    app: ivolve-app
    app.kubernetes.io/name: ivolve-app
    app.kubernetes.io/part-of: ivolve-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ivolve-app
  template:
    metadata:
      labels:
        app: ivolve-app
        app.kubernetes.io/name: ivolve-app
    spec:
      # Node Selector targeting isolated worker node labeled in Lab 10
      nodeSelector:
        project: ivolve
      # Toleration allowing scheduling on tainted worker node from Lab 10
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "ivolveApp"
          effect: "NoSchedule"
      # Init Container: Ensures database exists and grants privileges to app user
      initContainers:
        - name: init-mysql-db
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ivolveCM
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: ivolveCM
                  key: DB_USER
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivolveSecret
                  key: MYSQL_ROOT_PASSWORD
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivolveSecret
                  key: DB_PASSWORD
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL server at ${DB_HOST}:3306 to be ready..."
              until mysql -h "${DB_HOST}" -u root -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1;" > /dev/null 2>&1; do
                echo "MySQL not ready yet. Retrying in 2 seconds..."
                sleep 2
              done
              echo "MySQL is reachable! Creating database and granting privileges..."
              mysql -h "${DB_HOST}" -u root -p"${MYSQL_ROOT_PASSWORD}" <<EOF
              CREATE DATABASE IF NOT EXISTS ivolve;
              CREATE USER IF NOT EXISTS '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASSWORD}';
              ALTER USER '${DB_USER}'@'%' IDENTIFIED BY '${DB_PASSWORD}';
              GRANT ALL PRIVILEGES ON ivolve.* TO '${DB_USER}'@'%';
              FLUSH PRIVILEGES;
              EOF
              echo "Database 'ivolve' and user '${DB_USER}' successfully initialized!"
      # Main Application Container: Custom Node.js Express image from Docker Hub (Lab 8)
      containers:
        - name: ivolve-app
          image: zeyadmvtr/ivolve-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ivolveCM
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: ivolveCM
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ivolveSecret
                  key: DB_PASSWORD
            - name: DB_NAME
              value: "ivolve"
            - name: PORT
              value: "3000"
          volumeMounts:
            # Mount PersistentVolume (from Lab 13) to store access logs
            - name: app-logs-volume
              mountPath: /app/logs
      volumes:
        # Reference PersistentVolumeClaim created in Lab 13
        - name: app-logs-volume
          persistentVolumeClaim:
            claimName: ivolvePVC
