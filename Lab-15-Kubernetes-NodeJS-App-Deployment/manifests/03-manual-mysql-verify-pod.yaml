apiVersion: v1
kind: Pod
metadata:
  name: manual-mysql-verify
  namespace: ivolve
  labels:
    app: mysql-verify
spec:
  containers:
    - name: mysql-client
      image: mysql:8.0
      command:
        - sh
        - -c
        - |
          echo "=========================================================="
          echo ">>> 1. Verifying 'ivolve' Database and Grants as Application User '${DB_USER}'"
          echo "=========================================================="
          mysql -h "${DB_HOST}" -u "${DB_USER}" -p"${DB_PASSWORD}" -e "
            SHOW DATABASES;
            SHOW GRANTS FOR '${DB_USER}'@'%';
            USE ivolve;
            SHOW TABLES;
          "
          echo "=========================================================="
          echo ">>> Verification complete. Sleeping..."
          sleep 3600
      env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: ivolveCM
              key: DB_HOST
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: ivolveCM
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ivolveSecret
              key: DB_PASSWORD
