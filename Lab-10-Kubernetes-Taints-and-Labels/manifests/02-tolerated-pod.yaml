apiVersion: v1
kind: Pod
metadata:
  name: tolerated-ivolve-pod
  namespace: default
  labels:
    app: tolerated-workload
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  # Toleration allows this pod to be scheduled on the tainted node
  tolerations:
  - key: "workload"
    operator: "Equal"
    value: "ivolveApp"
    effect: "NoSchedule"
