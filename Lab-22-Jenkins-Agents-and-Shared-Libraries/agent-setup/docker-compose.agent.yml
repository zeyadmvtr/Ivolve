services:
  jenkins-slave:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: jenkins-slave-node
    restart: unless-stopped
    environment:
      - JENKINS_AGENT_SSH_PUBKEY=${JENKINS_AGENT_SSH_PUBKEY:-ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExamplePublicKeyForJenkinsAgent jenkins@agent}
    ports:
      - "2222:22"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_slave_data:/home/jenkins

volumes:
  jenkins_slave_data:
    name: jenkins_slave_data
