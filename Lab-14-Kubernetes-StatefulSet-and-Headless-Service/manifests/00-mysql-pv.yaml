apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-data-pv
  labels:
    app.kubernetes.io/name: ivolve-db
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/mysql-data
    type: DirectoryOrCreate
